<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbox — Send a message</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="index.html">Inbox</a>
      <nav><a class="muted" href="inbox.html">Host dashboard</a></nav>
    </header>

    <main>
      <section id="form-view">
        <h1>Send a message</h1>
        <p class="muted">Questions, reports, or files — the host will reply by email.</p>

        <form id="form" class="card" novalidate>
          <p id="form-error" class="alert hidden"></p>

          <div class="field">
            <label class="label" for="name">Your name</label>
            <input id="name" class="input" required>
            <p class="field-error" data-error="name"></p>
          </div>

          <div class="field">
            <label class="label" for="email">Your email</label>
            <input id="email" type="email" class="input" required>
            <p class="field-error" data-error="email"></p>
          </div>

          <div class="field">
            <label class="label" for="subject">Subject</label>
            <input id="subject" class="input" required>
            <p class="field-error" data-error="subject"></p>
          </div>

          <div class="field">
            <label class="label" for="body">Message</label>
            <textarea id="body" class="input" required></textarea>
            <p class="field-error" data-error="body"></p>
          </div>

          <div class="field">
            <label class="label" for="file">Attachment (optional, max 5&nbsp;MB)</label>
            <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,application/pdf">
          </div>

          <button id="submit-btn" class="btn full" type="submit">Send message</button>
        </form>
      </section>

      <section id="done-view" class="card hidden">
        <h2>Message sent</h2>
        <p class="muted">Your message has been delivered to the host. Keep this link to read any reply.</p>
        <a id="thread-link" class="btn" href="#">View conversation</a>
      </section>
    </main>

    <footer class="muted small" style="margin-top:28px;">Prototype</footer>
  </div>

  <script src="api.js"></script>
  <script>
    var form = $("#form");
    var errorBox = $("#form-error");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      hideAlert(errorBox);
      clearFieldErrors(form);

      var file = $("#file").files[0] || null;
      if (file && file.size > 5 * 1024 * 1024) {
        showAlert(errorBox, "Attachment must be 5 MB or smaller.");
        return;
      }

      var btn = $("#submit-btn");
      btn.disabled = true;
      btn.textContent = "Sending…";

      try {
        var attachmentIds = [];
        if (file) attachmentIds.push(await uploadFile(file));

        var result = await api.submitMessage({
          name: $("#name").value,
          email: $("#email").value,
          subject: $("#subject").value,
          body: $("#body").value,
          attachment_ids: attachmentIds,
        });

        $("#form-view").classList.add("hidden");
        $("#done-view").classList.remove("hidden");
        $("#thread-link").href = "visitor.html?token=" + encodeURIComponent(result.visitor_token);
      } catch (err) {
        if (err instanceof ApiError) {
          showAlert(errorBox, err.message);
          showFieldErrors(form, err.fields);
        } else {
          showAlert(errorBox, "Something went wrong. Please try again.");
        }
      } finally {
        btn.disabled = false;
        btn.textContent = "Send message";
      }
    });
  </script>
</body>
</html>
