name: inbox-micro

# Microservice layout: every bounded context runs as its own container, fronted
# by the Go API gateway. Use this to mimic the target architecture; use
# docker-compose.yml for the single-process modular monolith.

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-production}
  HTTP_ADDR: ":8080"
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
  DATABASE_URL: postgres://${POSTGRES_USER:-inbox}:${POSTGRES_PASSWORD:-inbox}@postgres:5432/${POSTGRES_DB:-inbox}?sslmode=disable
  STORAGE_ENDPOINT: storage:9000
  STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-localhost:9000}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-change-me}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-attachments}
  STORAGE_USE_SSL: ${STORAGE_USE_SSL:-false}
  MAILER_DRIVER: ${MAILER_DRIVER:-console}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-inbox@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Inbox}
  POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
  HOST_EMAIL: ${HOST_EMAIL:-host@example.com}
  HOST_NAME: ${HOST_NAME:-Host}
  HOST_PASSWORD: ${HOST_PASSWORD:-}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}

x-api-build: &api-build
  context: ../../src/backend

x-depends: &api-depends
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inbox}
      POSTGRES_DB: ${POSTGRES_DB:-inbox}
    # Published on loopback so host-run processes (make api-run) can connect.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inbox} -d ${POSTGRES_DB:-inbox}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # S3-compatible object storage (MinIO community images were discontinued).
  # Generates the SeaweedFS IAM config from the same credentials the app uses.
  # Avoid single quotes in the storage passwords (they are embedded in JSON).
  storage-init:
    image: alpine:3.20
    volumes:
      - storageconfig:/config
    command:
      - sh
      - -c
      - |
        printf '%s' '{"identities":[{"name":"inbox","credentials":[{"accessKey":"${STORAGE_ACCESS_KEY:-minioadmin}","secretKey":"${STORAGE_SECRET_KEY:-change-me}"}],"actions":["Admin","Read","Write","List","Tagging"]},{"name":"anonymous","actions":["Read","Write","List"]}]}' > /config/s3.json
    restart: "no"

  storage:
    image: chrislusf/seaweedfs:4.48
    command:
      - server
      - -s3
      - -s3.port=9000
      - -s3.config=/config/s3.json
      - -dir=/data
      - -ip=127.0.0.1
      - -master.port=9333
      - -volume.port=8180
      - -filer.port=8888
    ports:
      # Loopback only by default; publish publicly (or proxy a subdomain) for
      # remote browsers to reach presigned URLs.
      - "127.0.0.1:9000:9000"
    volumes:
      - storageconfig:/config
      - storagedata:/data
    depends_on:
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build: *api-build
    command: ["/usr/local/bin/migrate", "-seed"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  identity:
    build: *api-build
    command: ["/usr/local/bin/identity"]
    environment: *api-env
    depends_on: *api-depends
    restart: unless-stopped

  submission:
    build: *api-build
    command: ["/usr/local/bin/submission"]
    environment: *api-env
    depends_on: *api-depends
    restart: unless-stopped

  conversation:
    build: *api-build
    command: ["/usr/local/bin/conversation"]
    environment: *api-env
    depends_on: *api-depends
    restart: unless-stopped

  attachment:
    build: *api-build
    command: ["/usr/local/bin/attachment"]
    environment: *api-env
    depends_on:
      <<: *api-depends
      storage:
        condition: service_started
    restart: unless-stopped

  worker:
    build: *api-build
    command: ["/usr/local/bin/worker"]
    environment: *api-env
    depends_on:
      <<: *api-depends
      storage:
        condition: service_started
    restart: unless-stopped

  gateway:
    build: *api-build
    command: ["/usr/local/bin/gateway"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      GATEWAY_ADDR: ":8080"
      GATEWAY_IDENTITY_URL: http://identity:8080
      GATEWAY_SUBMISSION_URL: http://submission:8080
      GATEWAY_CONVERSATION_URL: http://conversation:8080
      GATEWAY_ATTACHMENT_URL: http://attachment:8080
    depends_on:
      - identity
      - submission
      - conversation
      - attachment
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ../caddy/Caddyfile.micro:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  pgdata:
  storagedata:
  storageconfig:
  caddydata:
  caddyconfig:
