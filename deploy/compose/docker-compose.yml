name: inbox

# Shared environment for every API-derived service (api, worker, migrate).
x-api-env: &api-env
  APP_ENV: ${APP_ENV:-production}
  HTTP_ADDR: ":8080"
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
  DATABASE_URL: postgres://${POSTGRES_USER:-inbox}:${POSTGRES_PASSWORD:-inbox}@postgres:5432/${POSTGRES_DB:-inbox}?sslmode=disable
  STORAGE_ENDPOINT: minio:9000
  STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-localhost:9000}
  STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-attachments}
  STORAGE_USE_SSL: ${STORAGE_USE_SSL:-false}
  MAILER_DRIVER: ${MAILER_DRIVER:-console}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-inbox@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Inbox}
  POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
  HOST_EMAIL: ${HOST_EMAIL:-host@example.com}
  HOST_NAME: ${HOST_NAME:-Host}
  HOST_PASSWORD: ${HOST_PASSWORD:-}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-2s}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inbox}
      POSTGRES_DB: ${POSTGRES_DB:-inbox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inbox} -d ${POSTGRES_DB:-inbox}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  migrate:
    build:
      context: ../../src/backend
    command: ["/usr/local/bin/migrate", "-seed"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../../src/backend
    environment: *api-env
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ../../src/backend
    command: ["/usr/local/bin/worker"]
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../../src/frontend
      args:
        # Empty means the browser calls the API on the same origin, which Caddy
        # routes to the api service.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
